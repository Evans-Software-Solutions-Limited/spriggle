name: E2E (Detox)

# Heavy iOS-simulator E2E — runs only on merge to main (not on PRs) to keep the
# per-PR feedback loop fast, per project decision. First real run may need
# tuning (installed simulator name, CocoaPods, Xcode scheme).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detox-ios:
    name: Detox iPad
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/mobile
    env:
      # The deterministic client flows don't need a live backend; a placeholder
      # keeps the app booting. Point at a dev stage for full backend flows.
      EXPO_PUBLIC_API_URL: https://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Install applesimutils
        env:
          # Homebrew 5.1.15+ refuses to load formulae from untrusted third-party
          # taps. Trust the wix tap explicitly (the forward-looking fix per
          # docs.brew.sh/Tap-Trust); HOMEBREW_NO_REQUIRE_TAP_TRUST is the
          # documented transitional fallback (removed in a later brew), kept as
          # belt-and-suspenders across the current brew versions on the runner.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew tap wix/brew
          brew trust wix/brew || true
          brew install applesimutils

      # `ios/` is gitignored (Continuous Native Generation), so it doesn't exist
      # on a fresh checkout. Generate it from app.json before building — this
      # also runs `pod install`. (EAS Build does this on its servers for the
      # production ship path; Detox builds locally on the runner, so it must be
      # done here explicitly.)
      - name: Prebuild iOS native project
        run: bunx expo prebuild --platform ios --clean

      - name: Detox build (Release)
        # Release bundles the JS, so no Metro packager is needed on CI (Debug
        # would require a running `expo start`).
        run: bun run e2e:build:release

      - name: Detox test
        run: bun run e2e:test:release
