name: Production Deploy + App Store Build

on:
  workflow_dispatch:
    inputs:
      skip_submit:
        description: "Skip App Store submit (build only)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend (SST)
    runs-on: ubuntu-latest
    environment: production
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: us-east-1

      - name: Deploy to production
        id: deploy
        run: |
          OUTPUT=$(bunx sst deploy --stage production 2>&1)
          echo "$OUTPUT"
          API_URL=$(echo "$OUTPUT" | grep -oP 'api:\s*\K(https://[^\s]+)' || echo "$OUTPUT" | grep -o 'https://[a-z0-9]*\.execute-api\.[a-z0-9-]*\.amazonaws\.com[^ ]*')
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "✅ Backend deployed: $API_URL"

  build-ios:
    name: Build + Submit iOS
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-backend
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Install Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Inject production API URL into eas.json
        run: |
          API_URL="${{ needs.deploy-backend.outputs.api_url }}"
          echo "Setting EXPO_PUBLIC_API_URL=$API_URL"
          jq --arg url "$API_URL" \
            '.build.production.env.EXPO_PUBLIC_API_URL = $url' \
            eas.json > eas.tmp && mv eas.tmp eas.json
          cat eas.json | jq '.build.production.env'

      - name: EAS Build (iOS production)
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --no-wait

      # Auth: EAS uses the App Store Connect API key registered globally via
      # `eas credentials` (one-time local setup) — no per-run secrets needed.
      - name: EAS Submit to App Store
        if: ${{ !inputs.skip_submit }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive \
            --wait
