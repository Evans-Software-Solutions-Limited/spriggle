<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spriggle — Classic Game (iPad landscape)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="spriggle.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #1b130b;
        font-family: var(--font-u);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #2a1d10, #160f08 80%);
      }
      .frame {
        width: 1194px;
        height: 834px;
        position: relative;
        transform-origin: center center;
        background: radial-gradient(
          140% 90% at 50% -10%,
          #fbf6ea,
          var(--paper) 60%
        );
        border-radius: 34px;
        overflow: hidden;
        box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.7);
        display: flex;
        gap: 26px;
        padding: 30px;
      }

      .board-col {
        height: 100%;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .board-col .patch {
        width: 100%;
      }

      /* pre-dig popup (screen-specific) */
      .predig {
        position: absolute;
        z-index: 5;
        left: 30%;
        top: 1%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        border-radius: 14px;
        padding: 9px 14px 10px;
        box-shadow: var(--e-pop);
        text-align: center;
      }
      .predig .big {
        font-family: var(--font-d);
        font-weight: 700;
        font-size: 22px;
        color: var(--gold);
        line-height: 1;
      }
      .predig .sub {
        font-size: 11px;
        font-weight: 800;
        opacity: 0.85;
        letter-spacing: 0.02em;
        margin-top: 3px;
      }
      .predig::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        transform: translateX(-50%);
        border: 7px solid transparent;
        border-top-color: var(--ink);
        border-bottom: 0;
      }

      /* RAIL */
      .rail {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .rail-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .rail-top .brand {
        font-size: 30px;
      }
      .brand .seed {
        width: 24px;
        height: 24px;
      }

      .score-card {
        padding: 16px 20px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        box-shadow: var(--e-2);
      }
      .score-card .lab {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-700);
      }
      .score-card .val {
        font-family: var(--font-d);
        font-weight: 700;
        font-size: 46px;
        color: var(--ink);
        line-height: 0.9;
        margin-top: 2px;
      }
      .score-card .best {
        text-align: right;
      }
      .score-card .best .bl {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .score-card .best .bv {
        font-family: var(--font-d);
        font-weight: 600;
        font-size: 22px;
        color: var(--ink-soft);
        line-height: 1;
      }

      .tool-mod {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 14px 16px 16px;
        background: linear-gradient(180deg, var(--surface-2), var(--surface));
        box-shadow: var(--e-2);
      }
      .mascot-stage {
        flex: 1;
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        min-height: 150px;
      }
      .mascot-stage svg {
        position: relative;
        height: 188px;
        width: auto;
        animation: idle 3.4s ease-in-out infinite;
      }
      @keyframes idle {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-5px) rotate(1deg);
        }
      }
      .speech {
        position: absolute;
        top: 0;
        right: 0;
        background: #fff;
        border: 2px solid var(--surface-line);
        border-radius: 14px 14px 14px 4px;
        padding: 8px 12px;
        font-size: 12.5px;
        font-weight: 800;
        color: var(--ink);
        max-width: 170px;
        box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.2);
        z-index: 2;
      }

      .spawn {
        display: flex;
        gap: 8px;
        margin: 10px 0 14px;
      }
      .spawn .pill {
        flex: 1;
        border-radius: 12px;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 2px solid transparent;
        font-weight: 800;
        font-size: 12px;
      }
      .spawn .pill .n {
        font-family: var(--font-d);
        font-weight: 700;
        font-size: 18px;
      }
      .spawn .pill.on {
        background: #e7efe0;
        color: var(--primary);
        border-color: #cfe0c2;
      }
      .spawn .pill.off {
        background: var(--paper-2);
        color: var(--ink-soft);
      }
      [data-theme="moonlit"] .spawn .pill.on {
        background: rgba(95, 211, 163, 0.16);
        border-color: rgba(95, 211, 163, 0.4);
      }
      .spawn .pill .sd {
        margin-left: auto;
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.7;
      }

      .selector {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .tool-btn {
        position: relative;
        border: 2.5px solid var(--surface-line);
        background: var(--paper);
        border-radius: 16px;
        padding: 13px 10px 12px;
        cursor: pointer;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 4px 0 var(--surface-line);
        transition: transform 0.08s;
      }
      .tool-btn .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tool-btn .tn {
        font-family: var(--font-d);
        font-weight: 700;
        font-size: 19px;
        color: var(--ink);
      }
      .tool-btn .ts {
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-soft);
        line-height: 1.25;
      }
      .tool-btn .ico {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface);
        flex: none;
      }
      .tool-btn.active {
        background: var(--primary);
        border-color: var(--primary-700);
        box-shadow:
          0 4px 0 var(--primary-700),
          0 0 0 4px rgba(60, 90, 58, 0.18);
      }
      .tool-btn.active .tn {
        color: var(--on-primary);
      }
      .tool-btn.active .ts {
        color: color-mix(in srgb, var(--on-primary) 80%, transparent);
      }
      .tool-btn.active .ico {
        background: var(--accent);
      }
      .tool-btn:active {
        transform: translateY(2px);
        box-shadow: none;
      }
      .kbd {
        position: absolute;
        top: 8px;
        right: 10px;
        font-size: 10px;
        font-weight: 800;
        color: var(--ink-soft);
        background: var(--surface);
        border-radius: 6px;
        padding: 1px 6px;
        opacity: 0.7;
      }
      .tool-btn.active .kbd {
        color: var(--on-primary);
        background: rgba(255, 255, 255, 0.18);
      }

      .rail-bottom {
        display: flex;
        gap: 12px;
      }
      .rail-bottom .coin-chip {
        flex: 1;
      }
      .coin-chip .plus {
        margin-left: auto;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 16px;
      }

      /* portrait nudge — app is landscape-locked */
      .rotate {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        place-items: center;
        background: #160f08;
        color: #f3ead7;
        text-align: center;
        font-family: var(--font-d);
      }
      .rotate .in {
        max-width: 280px;
        padding: 30px;
      }
      .rotate .ph {
        width: 60px;
        height: 96px;
        border: 3px solid #f3ead7;
        border-radius: 12px;
        margin: 0 auto 20px;
        animation: rot 1.8s ease-in-out infinite;
      }
      @keyframes rot {
        0%,
        40% {
          transform: rotate(0);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (max-aspect-ratio: 1/1) {
        .stage {
          display: none;
        }
        .rotate {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="frame" id="frame">
        <div class="board-col"><div id="boardHost"></div></div>

        <div class="rail">
          <div class="rail-top">
            <div class="brand">
              <span class="seed" id="seed"></span>Spriggle
            </div>
            <button class="icon-btn" title="Pause">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <rect x="6" y="5" width="4" height="14" rx="1.5" />
                <rect x="14" y="5" width="4" height="14" rx="1.5" />
              </svg>
            </button>
          </div>

          <div class="card score-card">
            <div>
              <div class="lab">Score</div>
              <div class="val" id="score">12,480</div>
            </div>
            <div class="best">
              <div class="bl">Best</div>
              <div class="bv">31,420</div>
            </div>
          </div>

          <div class="card tool-mod">
            <div class="mascot-stage">
              <div class="speech" id="speech">
                Dig a patch of <b>5 or more</b>!
              </div>
              <div id="mascot"></div>
            </div>
            <div class="spawn">
              <div class="pill on" id="spawnDig">
                <span class="n">+3</span> seeds <span class="sd">per dig</span>
              </div>
              <div class="pill off" id="spawnSwap">
                <span class="n">+6</span> seeds <span class="sd">per swap</span>
              </div>
            </div>
            <div class="selector">
              <button
                class="tool-btn active"
                id="btnDig"
                onclick="setTool('dig')"
              >
                <span class="kbd">1</span><span class="ico" id="icoDig"></span>
                <span class="row"><span class="tn">Dig</span></span>
                <span class="ts">Clear a group of 5+</span>
              </button>
              <button class="tool-btn" id="btnSwap" onclick="setTool('swap')">
                <span class="kbd">2</span><span class="ico" id="icoSwap"></span>
                <span class="row"><span class="tn">Swap</span></span>
                <span class="ts">Trade two to set up</span>
              </button>
            </div>
          </div>

          <div class="rail-bottom">
            <div class="coin-chip">
              <span class="c">¢</span><span class="cv">1,240</span
              ><span class="plus">+</span>
            </div>
            <button class="icon-btn" title="Power-ups">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--accent)"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M13 2L3 14h7l-1 8 10-12h-7z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="rotate">
      <div class="in">
        <div class="ph"></div>
        <div style="font-size: 22px; margin-bottom: 8px">Rotate to play</div>
        <div
          style="
            font-family: var(--font-u);
            font-weight: 700;
            font-size: 14px;
            opacity: 0.8;
          "
        >
          Spriggle is played in landscape.
        </div>
      </div>
    </div>

    <script src="plants.js"></script>
    <script src="board.js"></script>
    <script src="mascot.js"></script>
    <script>
      const BOARD = [
        [0, 0, 3, 3, 1, 4, 4, 2],
        [0, 3, 3, 1, 1, 4, 2, 2],
        [2, 3, 1, 1, 0, 4, 4, 2],
        [2, 2, 0, 0, 0, 3, 4, 1],
        [4, 2, 2, 0, 3, 3, 3, 1],
        [4, 4, 1, 1, 3, 0, 0, 1],
        [1, 4, 1, 2, 2, 0, 3, 3],
        [1, 1, 2, 2, 2, 4, 3, 0],
      ];
      const HL = new Set(["0-2", "0-3", "1-2", "1-1", "2-1"]);
      const overlay = `<div class="predig"><div class="big">+250</div><div class="sub">DIG · 5 TOMATOES</div></div>`;
      document.getElementById("boardHost").innerHTML = renderPatch(BOARD, {
        highlight: HL,
        overlay,
      });

      document.getElementById("seed").innerHTML =
        `<svg viewBox="0 0 24 24" fill="none"><path d="M12 21c-5-3-7-8-7-12 4 0 7 3 7 7" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 16c0-4 3-7 7-7 0 4-2 9-7 12" stroke="var(--primary-300)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      document.getElementById("icoDig").innerHTML = toolGlyph(
        "dig",
        "var(--ink)",
        22,
      );
      document.getElementById("icoSwap").innerHTML = toolGlyph(
        "swap",
        "var(--ink)",
        22,
      );
      function renderMascot(t) {
        document.getElementById("mascot").innerHTML = mascot(t, {});
      }
      renderMascot("dig");

      function setTool(t) {
        document
          .getElementById("btnDig")
          .classList.toggle("active", t === "dig");
        document
          .getElementById("btnSwap")
          .classList.toggle("active", t === "swap");
        document.getElementById("icoDig").innerHTML = toolGlyph(
          "dig",
          t === "dig" ? "var(--on-primary)" : "var(--ink)",
          22,
        );
        document.getElementById("icoSwap").innerHTML = toolGlyph(
          "swap",
          t === "swap" ? "var(--on-primary)" : "var(--ink)",
          22,
        );
        document.getElementById("spawnDig").className =
          "pill " + (t === "dig" ? "on" : "off");
        document.getElementById("spawnSwap").className =
          "pill " + (t === "swap" ? "on" : "off");
        document.getElementById("speech").innerHTML =
          t === "dig"
            ? "Dig a patch of <b>5 or more</b>!"
            : "Swap two to build a <b>bigger</b> patch.";
        renderMascot(t);
      }

      function fit() {
        const f = document.getElementById("frame");
        const s = Math.min(window.innerWidth / 1194, window.innerHeight / 834);
        f.style.transform = `scale(${s})`;
      }
      window.addEventListener("resize", fit);
      fit();
    </script>
  </body>
</html>
