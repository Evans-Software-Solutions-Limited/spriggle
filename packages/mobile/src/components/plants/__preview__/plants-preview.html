<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spriggle Plant SVGs — Preview</title>
<style>
  body { margin: 0; background: #4e3623; font-family: 'Fredoka', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; gap: 30px; }
  h1 { color: #f6efe0; margin: 0; }
  .row { display: flex; gap: 30px; align-items: flex-end; }
  .plant { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .plant svg { width: 120px; height: 120px; filter: drop-shadow(0 5px 4px rgba(0,0,0,.32)); }
  .label { color: #f6efe0; font-size: 14px; font-weight: 700; opacity: .85; }
  .cell { width: 130px; height: 130px; border-radius: 26%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 36%, #33230f, #46301c 72%);
    box-shadow: inset 0 4px 9px rgba(0,0,0,.55), inset 0 -2px 3px rgba(255,220,170,.05);
  }
  .cell svg { width: 108%; height: 108%; margin-top: -5%; }
  .section { color: #dccba6; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }
</style>
</head>
<body>

<h1>Spriggle — Juicy Plant SVGs</h1>
<p class="section">As they appear in soil cells (matching prototype)</p>

<div class="row">

  <!-- Watermelon -->
  <div class="plant">
    <div class="cell">
      <svg viewBox="0 0 100 100">
        <ellipse cx="50" cy="88" rx="24" ry="5" fill="#000" opacity="0.28"/>
        <defs><radialGradient id="jgWatermelon" cx="38%" cy="30%" r="80%"><stop offset="0%" stop-color="#ff8a6b"/><stop offset="60%" stop-color="#f2483c"/><stop offset="100%" stop-color="#c92f28"/></radialGradient></defs>
        <path d="M14,70 Q50,10 86,70 Z" fill="#1f7a44"/>
        <path d="M22,69 Q50,22 78,69 Z" fill="#7ee08a"/>
        <path d="M28,68 Q50,30 72,68 Z" fill="url(#jgWatermelon)"/>
        <g fill="#3a2f23"><ellipse cx="44" cy="55" rx="2.4" ry="3.6"/><ellipse cx="56" cy="55" rx="2.4" ry="3.6"/><ellipse cx="50" cy="47" rx="2.4" ry="3.6"/><ellipse cx="38" cy="62" rx="2.4" ry="3.6"/><ellipse cx="62" cy="62" rx="2.4" ry="3.6"/></g>
        <path d="M34,40 Q50,32 66,40" stroke="#fff" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="label">Watermelon</span>
  </div>

  <!-- Flower -->
  <div class="plant">
    <div class="cell">
      <svg viewBox="0 0 100 100">
        <ellipse cx="50" cy="88" rx="24" ry="5" fill="#000" opacity="0.28"/>

        <ellipse cx="50" cy="27" rx="9" ry="16" fill="url(#jgFlower)" transform="rotate(0 50 50)"/>
        <ellipse cx="50" cy="27" rx="9" ry="16" fill="url(#jgFlower)" transform="rotate(51.43 50 50)"/>
        <ellipse cx="50" cy="27" rx="9" ry="16" fill="url(#jgFlower)" transform="rotate(102.86 50 50)"/>
        <ellipse cx="50" cy="27" rx="9" ry="16" fill="url(#jgFlower)" transform="rotate(154.29 50 50)"/>
        <ellipse cx="50" cy="27" rx="9" ry="16" fill="url(#jgFlower)" transform="rotate(205.71 50 50)"/>
        <ellipse cx="50" cy="27" rx="9" ry="16" fill="url(#jgFlower)" transform="rotate(257.14 50 50)"/>
        <ellipse cx="50" cy="27" rx="9" ry="16" fill="url(#jgFlower)" transform="rotate(308.57 50 50)"/>
        <circle cx="50" cy="50" r="13" fill="#8a4a1e"/>
        <circle cx="46" cy="46" r="5" fill="#a55f2a"/>
        <ellipse cx="40" cy="34" rx="14" ry="9" fill="#ffffff" opacity="0.45" transform="rotate(-25 40 34)"/>
      </svg>
    </div>
    <span class="label">Flower</span>
  </div>

  <!-- Aubergine -->
  <div class="plant">

      <svg viewBox="0 0 100 100">

        <ellipse cx="44" cy="42" rx="8" ry="14" fill="#fff" opacity="0.35" transform="rotate(-20 44 42)"/>
      </svg>
    </div>
    <span class="label">Aubergine</span>
  </div>

  <!-- Tomato -->

    </div>
    <span class="label">Tomato</span>
  </div>

  <!-- Pumpkin -->
  <div class="plant">
    <div class="cell">
      <svg viewBox="0 0 100 100">
        <ellipse cx="50" cy="88" rx="24" ry="5" fill="#000" opacity="0.28"/>

        <ellipse cx="68" cy="61" rx="18" ry="24" fill="url(#jgPumpkin)"/>
        <ellipse cx="50" cy="61" rx="27" ry="27" fill="url(#jgPumpkin)"/>

        <path d="M50,37 C49,28 54,24 58,23" fill="none" stroke="#4e7a2e" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="42" cy="48" rx="7" ry="10" fill="#fff" opacity="0.35" transform="rotate(-15 42 48)"/>
      </svg>
    </div>
    <span class="label">Pumpkin</span>
  </div>

</div>
